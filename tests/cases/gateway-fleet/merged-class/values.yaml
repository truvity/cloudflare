# A merged class: both exposures collapse onto one Deployment and one
# Service. Cheaper, and the right shape when the exposures do not need
# separate addresses — neither may then carry its own proxy.
classes:
  internal:
    mergeGateways: true
    proxy:
      replicas: 2
      service:
        name: gateway-internal
      # The controller's default access-log line plus request headers that
      # say which client sent a request, and one default field overridden.
      accessLog:
        extraFields:
          origin: "%REQ(ORIGIN)%"
          referer: "%REQ_WITHOUT_QUERY(REFERER)%"
          sec-fetch-site: "%REQ(SEC-FETCH-SITE)%"
          user-agent: "%REQ(USER-AGENT):64%"
  customer:
    # Declared for later: a class with no proxy yet takes no parametersRef.
    mergeGateways: false
    proxy:
      enabled: false

exposures:
  public:
    class: internal
    health:
      hostname: gateway-health.example.com
      certificate:
        issuerRef:
          name: example-ca
          kind: ClusterIssuer
          group: cert-manager.io
    networkPolicy:
      enabled: true
  private:
    class: internal
    health:
      hostname: gateway-health.internal.example
      certificate:
        issuerRef:
          name: example-ca
          kind: ClusterIssuer
          group: cert-manager.io
