# EKS with ACK: the Policy, Role and PodIdentityAssociation come with static-site-infra.
registry:
  auth: ecr
  ack:
    enabled: true
    clusterName: example
    repositoryArns:
      - arn:aws:ecr:eu-central-1:123456789012:repository/example
    tags:
      project: example
serviceAccount:
  name: static-site
