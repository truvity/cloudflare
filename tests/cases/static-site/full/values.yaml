# Every optional knob on.
replicaCount: 3
image:
  tag: v1.2.3
  digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
imagePullSecrets:
  - name: server-image-pull
site:
  artifact:
    ref: registry.example.com/static/www:main
    digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  pullSecretName: static-pull
  plainHTTP: false
  spaFallback: true
  notFoundPage: errors/404.html
  contentSizeLimit: 256Mi
placeholders:
  gtmId: GTM-ABC1234
  apiBase: https://api.example.com
cache:
  hashedPattern: '[.-][0-9a-zA-Z_-]{8}\.[a-z]+$'
  htmlMaxAge: 30s
  staleWhileRevalidate: 120s
headers:
  Content-Security-Policy: "default-src 'self'"
  X-Frame-Options: SAMEORIGIN
logLevel: debug
service:
  port: 8080
  annotations:
    example.com/scrape: "false"
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi
podAnnotations:
  example.com/team: web
nodeSelector:
  kubernetes.io/arch: arm64
priorityClassName: high
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: static-site
podDisruptionBudget:
  minAvailable: 2
serviceMonitor:
  enabled: true
  labels:
    release: metrics
networkPolicy:
  enabled: true
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: gateway
  metricsFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
  extraEgress:
    - to:
        - ipBlock:
            cidr: 192.0.2.0/24
