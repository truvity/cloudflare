# Every optional knob on: origin CA verification, arch-pinned scheduling,
# zone spread, PDB, extra args.
caSecretName: cloudflared-origin-ca
extraArgs: ["--protocol", "quic"]
nodeSelector:
  kubernetes.io/arch: arm64
tolerations:
  - key: arch
    operator: Exists
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: cloudflared
podDisruptionBudget:
  enabled: true
podAnnotations:
  example.com/checksum: abc
priorityClassName: system-cluster-critical
serviceAccount:
  annotations:
    example.com/role: tunnel
