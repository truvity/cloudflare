# transfer-encoding frames the body.
classes:
  internal: {}
exposures:
  public:
    class: internal
    clientTrafficPolicy:
      enabled: true
    health:
      hostname: gateway-health.example.com
      certificate:
        issuerRef:
          name: example-ca
          kind: ClusterIssuer
          group: cert-manager.io

clientTraffic:
  earlyRequestHeaders:
    remove:
      - transfer-encoding
