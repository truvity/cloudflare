---
# Source: static-site-infra/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: static-site
  namespace: default
  labels:
    app.kubernetes.io/name: static-site
    app.kubernetes.io/instance: static-site
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    "argocd.argoproj.io/sync-options": "Prune=false,Delete=false"
    "argocd.argoproj.io/sync-wave": "-15"

---
# Source: static-site-infra/templates/ack.yaml
apiVersion: iam.services.k8s.aws/v1alpha1
kind: Role
metadata:
  name: example-static-www
  namespace: default
  labels:
    app.kubernetes.io/name: static-site
    app.kubernetes.io/instance: static-site
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    argocd.argoproj.io/sync-wave: "-25"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    services.k8s.aws/adoption-policy: adopt-or-create
spec:
  name: example-static-www
  description: "static-site default/static-site: workload role"
  permissionsBoundary: arn:aws:iam::123456789012:policy/example-boundary
  tags:
    - key: cluster
      value: "example"
  assumeRolePolicyDocument: |
    {
      "Version": "2012-10-17",
      "Statement": [{
        "Effect": "Allow",
        "Principal": {"Service": "pods.eks.amazonaws.com"},
        "Action": ["sts:AssumeRole", "sts:TagSession"],
        "Condition": {
          "StringEquals": {
            "aws:SourceAccount": "123456789012",
            "aws:SourceArn": "arn:aws:eks:eu-central-1:123456789012:cluster/example",
            "aws:RequestTag/kubernetes-namespace": "default",
            "aws:RequestTag/kubernetes-service-account": "static-site"
          }
        }
      }]
    }
  policyRefs:
    - from:
        name: example-static-www

---
# Source: static-site-infra/templates/ack.yaml
apiVersion: eks.services.k8s.aws/v1alpha1
kind: PodIdentityAssociation
metadata:
  name: example-static-www
  namespace: default
  labels:
    app.kubernetes.io/name: static-site
    app.kubernetes.io/instance: static-site
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  clusterName: example
  namespace: default
  serviceAccount: static-site
  roleRef:
    from:
      name: example-static-www

---
# Source: static-site-infra/templates/ack.yaml
apiVersion: iam.services.k8s.aws/v1alpha1
kind: Policy
metadata:
  name: example-static-www
  namespace: default
  labels:
    app.kubernetes.io/name: static-site
    app.kubernetes.io/instance: static-site
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    services.k8s.aws/adoption-policy: adopt-or-create
    services.k8s.aws/adoption-fields: '{"arn":"arn:aws:iam::123456789012:policy/example-static-www"}'
spec:
  name: example-static-www
  description: "static-site default/static-site: ECR pull access"
  policyDocument: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": ["ecr:GetAuthorizationToken"],
          "Resource": "*"
        },
        {
          "Effect": "Allow",
          "Action": [
            "ecr:BatchGetImage",
            "ecr:GetDownloadUrlForLayer",
            "ecr:BatchCheckLayerAvailability"
          ],
          "Resource": ["arn:aws:ecr:eu-central-1:123456789012:repository/example","arn:aws:ecr:eu-central-1:210987654321:repository/other"]
        }
      ]
    }
