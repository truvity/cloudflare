---
# Source: static-site-infra/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: static-site-infra-identity-check
  namespace: default
  labels:
    app.kubernetes.io/name: static-site
    app.kubernetes.io/instance: static-site-infra
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: static-site-infra
      app.kubernetes.io/component: static-site-identity-check
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 169.254.170.23/32
      ports:
        - port: 80
          protocol: TCP
    - ports:
        - port: 443
          protocol: TCP

---
# Source: static-site-infra/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: static-site
  namespace: default
  labels:
    app.kubernetes.io/name: static-site
    app.kubernetes.io/instance: static-site-infra
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    "argocd.argoproj.io/sync-options": "Prune=false,Delete=false"
    "argocd.argoproj.io/sync-wave": "-15"

---
# Source: static-site-infra/templates/ack.yaml
apiVersion: iam.services.k8s.aws/v1alpha1
kind: Role
metadata:
  name: example-default-static-site-infra
  namespace: default
  labels:
    app.kubernetes.io/name: static-site
    app.kubernetes.io/instance: static-site-infra
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    argocd.argoproj.io/sync-wave: "-25"
spec:
  name: example-default-static-site-infra
  description: "static-site default/static-site-infra: workload role"
  tags:
    - key: cluster
      value: "example"
    - key: "project"
      value: "example"
  assumeRolePolicyDocument: |
    {
      "Version": "2012-10-17",
      "Statement": [{
        "Effect": "Allow",
        "Principal": {"Service": "pods.eks.amazonaws.com"},
        "Action": ["sts:AssumeRole", "sts:TagSession"],
        "Condition": {
          "StringEquals": {
            "aws:RequestTag/kubernetes-namespace": "default",
            "aws:RequestTag/kubernetes-service-account": "static-site"
          }
        }
      }]
    }
  policyRefs:
    - from:
        name: example-default-static-site-infra

---
# Source: static-site-infra/templates/ack.yaml
apiVersion: eks.services.k8s.aws/v1alpha1
kind: PodIdentityAssociation
metadata:
  name: example-default-static-site-infra
  namespace: default
  labels:
    app.kubernetes.io/name: static-site
    app.kubernetes.io/instance: static-site-infra
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  clusterName: example
  namespace: default
  serviceAccount: static-site
  roleRef:
    from:
      name: example-default-static-site-infra

---
# Source: static-site-infra/templates/ack.yaml
apiVersion: iam.services.k8s.aws/v1alpha1
kind: Policy
metadata:
  name: example-default-static-site-infra
  namespace: default
  labels:
    app.kubernetes.io/name: static-site
    app.kubernetes.io/instance: static-site-infra
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
spec:
  name: example-default-static-site-infra
  description: "static-site default/static-site-infra: ECR pull access"
  policyDocument: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": ["ecr:GetAuthorizationToken"],
          "Resource": "*"
        },
        {
          "Effect": "Allow",
          "Action": [
            "ecr:BatchGetImage",
            "ecr:GetDownloadUrlForLayer",
            "ecr:BatchCheckLayerAvailability"
          ],
          "Resource": ["arn:aws:ecr:eu-central-1:123456789012:repository/example"]
        }
      ]
    }
