---
# Source: static-site-infra/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: www-static-site
  namespace: ns-a
  labels:
    app.kubernetes.io/name: static-site
    app.kubernetes.io/instance: www
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    "argocd.argoproj.io/sync-options": "Prune=false,Delete=false"
    "argocd.argoproj.io/sync-wave": "-15"

---
# Source: static-site-infra/templates/ack.yaml
apiVersion: iam.services.k8s.aws/v1alpha1
kind: Role
metadata:
  name: example-ns-a-www
  namespace: ns-a
  labels:
    app.kubernetes.io/name: static-site
    app.kubernetes.io/instance: www
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    argocd.argoproj.io/sync-wave: "-25"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    services.k8s.aws/adoption-policy: adopt-or-create
spec:
  name: example-ns-a-www
  description: "static-site ns-a/www: workload role"
  tags:
    - key: cluster
      value: "example"
  assumeRolePolicyDocument: |
    {
      "Version": "2012-10-17",
      "Statement": [{
        "Effect": "Allow",
        "Principal": {"Service": "pods.eks.amazonaws.com"},
        "Action": ["sts:AssumeRole", "sts:TagSession"],
        "Condition": {
          "StringEquals": {
            "aws:RequestTag/kubernetes-namespace": "ns-a",
            "aws:RequestTag/kubernetes-service-account": "www-static-site"
          }
        }
      }]
    }
  policyRefs:
    - from:
        name: example-ns-a-www
---
# Source: static-site-infra/templates/ack.yaml
apiVersion: eks.services.k8s.aws/v1alpha1
kind: PodIdentityAssociation
metadata:
  name: example-ns-a-www
  namespace: ns-a
  labels:
    app.kubernetes.io/name: static-site
    app.kubernetes.io/instance: www
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  clusterName: example
  namespace: ns-a
  serviceAccount: www-static-site
  roleRef:
    from:
      name: example-ns-a-www

---
# Source: static-site-infra/templates/ack.yaml
apiVersion: iam.services.k8s.aws/v1alpha1
kind: Policy
metadata:
  name: example-ns-a-www
  namespace: ns-a
  labels:
    app.kubernetes.io/name: static-site
    app.kubernetes.io/instance: www
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    services.k8s.aws/adoption-policy: adopt-or-create
spec:
  name: example-ns-a-www
  description: "static-site ns-a/www: ECR pull access"
  policyDocument: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": ["ecr:GetAuthorizationToken"],
          "Resource": "*"
        },
        {
          "Effect": "Allow",
          "Action": [
            "ecr:BatchGetImage",
            "ecr:GetDownloadUrlForLayer",
            "ecr:BatchCheckLayerAvailability"
          ],
          "Resource": ["arn:aws:ecr:eu-central-1:123456789012:repository/example"]
        }
      ]
    }
