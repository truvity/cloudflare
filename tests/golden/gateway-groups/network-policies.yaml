# Source: gateway-groups/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: console-api-ingress-from-gateway
  namespace: console
  annotations:
    argocd.argoproj.io/sync-wave: "70"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gateway-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: envoy
      ports:
        - port: 8080
          protocol: TCP
    - from:
      - ipBlock:
          cidr: 100.64.0.0/10
      ports:
      - port: 8080
        protocol: TCP

