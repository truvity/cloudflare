apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: console-hooks-ingress-from-gateway
  namespace: console
  annotations:
    argocd.argoproj.io/sync-wave: "66"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: hooks
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gateway-system
          podSelector:
