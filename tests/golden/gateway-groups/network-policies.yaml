# Source: gateway-groups/templates/certificate.yaml
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: console-example-com-tls
  namespace: envoy-gateway-system
  annotations:
    argocd.argoproj.io/sync-wave: "66"
spec:
  secretName: console-example-com-tls
  dnsNames:
    - "console.example.com"
  privateKey:
    rotationPolicy: Always
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: example-ca

