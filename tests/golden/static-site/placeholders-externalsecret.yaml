---
# Source: static-site/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: static-site
  namespace: default
  labels:
    app.kubernetes.io/name: static-site
    app.kubernetes.io/instance: static-site
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: static-site
      app.kubernetes.io/instance: static-site
  template:
    metadata:
      labels:
        app.kubernetes.io/name: static-site
        app.kubernetes.io/instance: static-site
      annotations:
        checksum/placeholders: 44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a
    spec:
      serviceAccountName: static-site
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: static-site
          image: "ghcr.io/truvity/edge/static-site:0.0.0"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: STATIC_SITE_ARTIFACT_REF
              value: "registry.example.com/static/site"
            - name: STATIC_SITE_CONTENT_DIR
              value: /var/run/site
            - name: STATIC_SITE_PLAIN_HTTP
              value: "false"
            - name: STATIC_SITE_SPA_FALLBACK
              value: "false"
            - name: STATIC_SITE_NOT_FOUND_PAGE
              value: "404.html"
            - name: STATIC_SITE_MAX_BYTES
              value: "536870912"
            - name: STATIC_SITE_MAX_FILES
              value: "50000"
            - name: STATIC_SITE_HTML_MAX_AGE
              value: "60s"
            - name: STATIC_SITE_STALE_WHILE_REVALIDATE
              value: "300s"
            - name: STATIC_SITE_PLACEHOLDERS_DIR
              value: /etc/static-site-secrets
            - name: STATIC_SITE_PLACEHOLDERS_KEYS
              value: "gtmId"
            - name: STATIC_SITE_PLACEHOLDERS_OPTIONAL_KEYS
              value: "bannerText"
            - name: STATIC_SITE_PLACEHOLDERS_STRICT
              value: "true"
            - name: STATIC_SITE_LOG_LEVEL
              value: "info"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: ops
              containerPort: 8081
              protocol: TCP
          # The artifact is pulled before the site port opens; startup
          # allows for a slow registry without loosening liveness.
          startupProbe:
            httpGet:
              path: /readyz
              port: ops
            periodSeconds: 2
            failureThreshold: 90
          livenessProbe:
            httpGet:
              path: /healthz
              port: ops
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: ops
            periodSeconds: 5
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 25m
              memory: 64Mi
          volumeMounts:
            - name: content
              mountPath: /var/run/site
            - name: placeholder-secret
              mountPath: /etc/static-site-secrets
              readOnly: true
      volumes:
        - name: content
          emptyDir:
            medium: Memory
            sizeLimit: "1Gi"
        - name: placeholder-secret
          secret:
            secretName: static-site-values

---
# Source: static-site/templates/externalsecret.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: static-site-values
  namespace: default
  annotations:
    argocd.argoproj.io/ignore-healthcheck: "true"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: example-store
  target:
    name: static-site-values
    creationPolicy: Owner
  data:
    - secretKey: bannerText
      remoteRef:
        key: static-sites/docs.example/placeholders
        property: banner-text
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: gtmId
      remoteRef:
        key: static-sites/docs.example/placeholders
        property: gtm-id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
