---
# Source: static-site/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: static-site
  namespace: apps
  labels:
    app.kubernetes.io/name: static-site
    app.kubernetes.io/instance: static-site
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: static-site
      app.kubernetes.io/instance: static-site
  template:
    metadata:
      labels:
        app.kubernetes.io/name: static-site
        app.kubernetes.io/instance: static-site
      annotations:
        checksum/placeholders: 81b2d1848721f628d6c3f49be295fb73b21ee6e5ffe7b033ba6411a5f5656f38
        example.com/team: web
    spec:
      serviceAccountName: static-site
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      imagePullSecrets:
        - name: server-image-pull
      priorityClassName: high
      nodeSelector:
        kubernetes.io/arch: arm64
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: static-site
          maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: static-site
          image: "ghcr.io/truvity/edge/static-site:v1.2.3@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: STATIC_SITE_ARTIFACT_REF
              value: "registry.example.com/static/www:main"
            - name: STATIC_SITE_ARTIFACT_DIGEST
              value: "sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
            - name: STATIC_SITE_CONTENT_DIR
              value: /var/run/site
            - name: STATIC_SITE_PLAIN_HTTP
              value: "false"
            - name: STATIC_SITE_SPA_FALLBACK
              value: "true"
            - name: STATIC_SITE_NOT_FOUND_PAGE
              value: "errors/404.html"
            - name: STATIC_SITE_MAX_BYTES
              value: "536870912"
            - name: STATIC_SITE_MAX_FILES
              value: "50000"
            - name: STATIC_SITE_HTML_MAX_AGE
              value: "30s"
            - name: STATIC_SITE_STALE_WHILE_REVALIDATE
              value: "120s"
            - name: STATIC_SITE_HASHED_PATTERN
              value: "[.-][0-9a-zA-Z_-]{8}\\.[a-z]+$"
            - name: STATIC_SITE_HEADERS
              value: "{\"Content-Security-Policy\":\"default-src 'self'\",\"X-Frame-Options\":\"SAMEORIGIN\"}"
            - name: STATIC_SITE_PLACEHOLDERS_FILE
              value: /etc/static-site/placeholders.json
            - name: STATIC_SITE_LOG_LEVEL
              value: "debug"
            - name: DOCKER_CONFIG
              value: /etc/registry-auth
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: ops
              containerPort: 8081
              protocol: TCP
          # The artifact is pulled before the site port opens; startup
          # allows for a slow registry without loosening liveness.
          startupProbe:
            httpGet:
              path: /readyz
              port: ops
            periodSeconds: 2
            failureThreshold: 90
          livenessProbe:
            httpGet:
              path: /healthz
              port: ops
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: ops
            periodSeconds: 5
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          volumeMounts:
            - name: content
              mountPath: /var/run/site
            - name: placeholders
              mountPath: /etc/static-site
              readOnly: true
            - name: registry-auth
              mountPath: /etc/registry-auth
              readOnly: true
      volumes:
        - name: content
          emptyDir:
            medium: Memory
            sizeLimit: "256Mi"
        - name: placeholders
          configMap:
            name: static-site-placeholders
        - name: registry-auth
          secret:
            secretName: static-pull
            items:
              - key: .dockerconfigjson
                path: config.json

