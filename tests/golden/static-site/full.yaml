apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: static-site
  namespace: apps
  labels:
    app.kubernetes.io/name: static-site
    app.kubernetes.io/instance: static-site
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    release: metrics
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: static-site
      app.kubernetes.io/instance: static-site
  endpoints:
    - port: ops
      path: /metrics
      interval: 30s
