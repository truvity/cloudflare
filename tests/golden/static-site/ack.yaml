# Source: static-site/templates/ack.yaml
apiVersion: iam.services.k8s.aws/v1alpha1
kind: Policy
metadata:
  name: example-default-static-site
  namespace: default
  labels:
    app.kubernetes.io/name: static-site
    app.kubernetes.io/instance: static-site
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
spec:
  name: example-default-static-site
  description: "static-site default/static-site: ECR pull access"
  policyDocument: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": ["ecr:GetAuthorizationToken"],
          "Resource": "*"
        },
        {
          "Effect": "Allow",
          "Action": [
            "ecr:BatchGetImage",
            "ecr:GetDownloadUrlForLayer",
            "ecr:BatchCheckLayerAvailability"
          ],
          "Resource": ["arn:aws:ecr:eu-central-1:123456789012:repository/example"]
        }
      ]
    }
