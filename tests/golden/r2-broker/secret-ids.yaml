---
# Source: r2-broker/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: r2-broker
  namespace: default
  labels:
    app.kubernetes.io/name: r2-broker
    app.kubernetes.io/instance: r2-broker
    app.kubernetes.io/component: broker
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: r2-broker
      app.kubernetes.io/instance: r2-broker
      app.kubernetes.io/component: broker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: r2-broker
        app.kubernetes.io/instance: r2-broker
        app.kubernetes.io/component: broker
      annotations:
        # A config change (a new grant row, a rotated parentTokenId,
        # ...) must roll the pods, not just update a ConfigMap nobody
        # reads until the next restart.
        checksum/config: 75e7705ce02f8f4a49ac0e192e6b761db88db7f9cbffcfe5e3d658bc7e37ed65
    spec:
      serviceAccountName: r2-broker
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: r2-broker
          image: "ghcr.io/truvity/cloudflare/r2broker:0.0.0"
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - --config
            - /etc/r2broker/broker.yaml
            - --addr
            - :8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources: 
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /etc/r2broker
              readOnly: true
            - name: parent-token
              mountPath: /secrets
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: r2-broker-config
        - name: parent-token
          secret:
            secretName: r2-broker-parent-token
            items:
              - key: token
                # A fixed filename regardless of the Secret's own key
                # name, so the broker's config (parentTokenFile) never
                # has to know what the estate happened to call it.
                path: token
              - key: account-id
                # Matches configmap.yaml's account.idFile.
                path: account-id
              - key: parent-token-id
                # Matches configmap.yaml's account.parentTokenIdFile.
                path: parent-token-id
