---
# Source: r2-broker/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: r2-broker-config
  namespace: default
  labels:
    app.kubernetes.io/name: r2-broker
    app.kubernetes.io/instance: r2-broker
    app.kubernetes.io/component: broker
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
data:
  broker.yaml: |
    account:
      idFile: /secrets/account-id
      parentTokenFile: /secrets/token
      parentTokenIdFile: /secrets/parent-token-id
    audience: r2-broker
    grants: []
    groupsClaim: groups
    issuer: https://issuer.example.com
    minting:
      mode: local

