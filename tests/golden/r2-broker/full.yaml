  ports:
    - name: http
      port: 9090
      targetPort: http
      protocol: TCP

---
# Source: r2-broker/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: r2-broker
  namespace: default
  labels:
    app.kubernetes.io/name: r2-broker
    app.kubernetes.io/instance: r2-broker
    app.kubernetes.io/component: broker
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: r2-broker
      app.kubernetes.io/instance: r2-broker
      app.kubernetes.io/component: broker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: r2-broker
        app.kubernetes.io/instance: r2-broker
        app.kubernetes.io/component: broker
        team: platform
      annotations:
        # A config change (a new grant row, a rotated parentTokenId,
        # ...) must roll the pods, not just update a ConfigMap nobody
        # reads until the next restart.
        checksum/config: 549e67bac09f0856f1bb96c03948f09c26022f819c94761b4039af2702c03636
        example.com/scrape: "true"
    spec:
      serviceAccountName: r2-broker-custom-sa
      terminationGracePeriodSeconds: 45
      priorityClassName: system-cluster-critical
      nodeSelector: 
        kubernetes.io/os: linux
      tolerations: 
        - effect: NoSchedule
          key: dedicated
          operator: Equal
          value: broker
      affinity: 
        podAntiAffinity: {}
      topologySpreadConstraints: 
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: r2-broker
          image: "ghcr.io/truvity/cloudflare/r2-broker:1.2.3"
          imagePullPolicy: Always
          args:
            - serve
            - --config
            - /etc/r2broker/broker.yaml
            - --addr
            - :9090
            - --audit-receiver-url
            - http://audit-receiver.example.svc:8443
            - --audit-token-file
            - /var/run/audit-token/token
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 9090
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources: 
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/r2broker
              readOnly: true
            - name: parent-token
              mountPath: /secrets
              readOnly: true
            - name: audit-token
              mountPath: /var/run/audit-token
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: r2-broker-config
        - name: parent-token
          secret:
            secretName: r2-broker-parent-token
            items:
              - key: token
                # A fixed filename regardless of the Secret's own key
                # name, so the broker's config (parentTokenFile) never
                # has to know what the estate happened to call it.
                path: token
        # No Secret: the broker needs no audit credential of its own
        # (design §2.8), matching every other application on the shared
        # audit platform. Kubernetes mints this token, scoped to the
        # "audit" audience, and rotates it before it expires.
        - name: audit-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: audit
                  expirationSeconds: 7200
                  path: token
