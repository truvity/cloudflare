---
# Source: r2-broker/templates/pdb.yaml
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: r2-broker
  namespace: default
  labels:
    app.kubernetes.io/name: r2-broker
    app.kubernetes.io/instance: r2-broker
    app.kubernetes.io/component: broker
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: r2-broker
      app.kubernetes.io/instance: r2-broker
      app.kubernetes.io/component: broker

---
# Source: r2-broker/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: r2-broker-custom-sa
  namespace: default
  labels:
    app.kubernetes.io/name: r2-broker
    app.kubernetes.io/instance: r2-broker
    app.kubernetes.io/component: broker
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    example.com/owner: platform

---
# Source: r2-broker/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: r2-broker-config
  namespace: default
  labels:
    app.kubernetes.io/name: r2-broker
    app.kubernetes.io/instance: r2-broker
    app.kubernetes.io/component: broker
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
data:
  broker.yaml: |
    account:
      id: example-account-id
      parentTokenFile: /secrets/token
      parentTokenId: example-parent-token-id
    audience: r2-broker
    grants:
    - bucket: example-bucket
      group: ci:cache:reader
      permission: object-read-only
      prefixes:
      - go-build/
      - bazel-remote/
      ttlSeconds: 900
    - bucket: example-bucket
      group: ci:cache:writer
      permission: object-read-write
      prefixes:
      - go-build/
      - bazel-remote/
      ttlSeconds: 900
    groupsClaim: groups
    issuer: https://issuer.example.com
    minting:
      mode: api

