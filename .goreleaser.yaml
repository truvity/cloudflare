# Tag-triggered release through truvity/ci-workflows release-public.yaml,
# which runs goreleaser and then pushes every chart under charts/ to
# ghcr.io/truvity/charts at the tag's version.
#
# No binaries: this repository ships a Helm chart and a Go library, which
# needs no build step — goreleaser's job here is the GitHub Release with
# the changelog, nothing else. `skip: true` is its documented shape for
# library projects. (v2.5.0 to v2.18.0 also built the r2broker binary,
# archive and image; v2.19.0 removed the broker.)
version: 2

builds:
  - skip: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^chore"
      - "^ci"
      - "^docs"
      - "^test"

release:
  github: {}
  header: |
    ## truvity/cloudflare {{ .Tag }}

    | | |
    |---|---|
    | cloudflared chart | `oci://ghcr.io/truvity/charts/cloudflared:{{ .Version }}` |
    | Go | `go get github.com/truvity/cloudflare/v2@{{ .Tag }}` |
