name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * *" # daily 6am UTC

permissions:
  contents: read

jobs:
  # Deliberately NOT in ci.yaml's recipe list and not a required context: a
  # standard-library advisory with no released fix would otherwise wedge
  # every pull request on a finding nobody can act on.
  govulncheck:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@a523f2f6e5868b00362056569c667243631fd90f # v3.26.2
    with:
      recipes: '["vuln"]'
