apiVersion: v2
name: gateway-policies
description: >-
  Envoy Gateway security policies, the half that protects what the other two
  charts expose: a baseline ClientTrafficPolicy (TLS floor and cipher set)
  on every Gateway of a namespace unless it opts out by label, stricter TLS
  per Gateway or listener, a SecurityPolicy per protected route or listener
  (browser sign-in with OIDC, bearer tokens with JWT, authorization on a
  groups claim, CSRF in shadow or enforce), and BackendTLSPolicy for
  backends that present a private-chain certificate. The TLS floor is on by
  default; nothing authenticates until it is given an issuer.
type: application
