{{- range $key, $spec := .Values.backendTrafficPolicies }}
{{- $p := include "policies.backendTraffic.resolve" (dict "key" $key "spec" $spec) | fromYaml }}
{{- if $p.enabled }}
---
{{- /* How the gateway talks to the backend behind one route, rule or
       Gateway: timeouts, a request body limit, a local rate limit, retries.
       The blocks are Envoy Gateway's own, passed through verbatim. */}}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ $p.name }}
  namespace: {{ $p.namespace }}
  {{- with include "policies.annotations" (dict "root" $ "extra" $p.annotations) | fromYaml }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $p.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- include "policies.backendTraffic.spec" $p | nindent 2 }}
{{- end }}
{{- end }}
