#    jwt: {}                        # merged over defaults.jwt
#    authorization: {}              # merged over defaults.authorization
#    csrf: {}                       # merged over defaults.csrf
#    extraSpec: {}                  # deep-merged over the generated spec, last

# ---------------------------------------------------------------------------
# Re-encryption to a backend with a private-chain certificate. Off unless
# an entry exists.
# ---------------------------------------------------------------------------
backendTLSPolicies: {}
