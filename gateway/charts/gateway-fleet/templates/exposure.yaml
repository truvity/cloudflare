{{- range $name, $spec := .Values.exposures }}
{{- $raw := $spec | default dict }}
{{- $c := include "gateway.class.resolve" (dict "name" $raw.class "spec" (get $.Values.classes ($raw.class | default "")) ) | fromYaml }}
{{- $e := include "gateway.exposure.resolve" (dict "name" $name "spec" $raw "class" $c) | fromYaml }}
{{- if and $e.enabled $c.enabled }}
{{- $ownProxy := include "gateway.exposure.ownProxy" (dict "class" $c "exposure" $e) }}
{{- $allowedRoutes := include "gateway.allowedRoutes.resolve" $e.health.allowedRoutes | fromYaml }}
---
{{- /* One Gateway per exposure. Its own listener is the health endpoint, so
       the exposure always has at least one listener and its proxies exist
       before the first ListenerSet arrives. Everything else attaches as a
       ListenerSet (see the gateway-groups chart). */}}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $e.gatewayName }}
  namespace: {{ $e.namespace }}
  {{- with include "gateway.annotations" (dict "root" $ "extra" $e.annotations) | fromYaml }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $e.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  gatewayClassName: {{ $c.name }}
  {{- if $ownProxy }}
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: {{ $e.proxy.name }}
  {{- end }}
  allowedListeners:
    namespaces:
      {{- toYaml $e.allowedListeners.namespaces | nindent 6 }}
  listeners:
    - name: {{ $e.health.listenerName }}
      protocol: {{ $e.health.protocol }}
      port: {{ $e.health.port }}
      hostname: {{ $e.health.hostname | quote }}
      {{- if eq $e.health.protocol "HTTPS" }}
      tls:
        mode: Terminate
        certificateRefs:
          {{- /* group is server-defaulted to "" — set it explicitly, or a
                 GitOps controller diffs against its own render forever. */}}
          - group: ""
            kind: Secret
            name: {{ $e.health.tls.secretName }}
      {{- end }}
      allowedRoutes:
        {{- toYaml $allowedRoutes | nindent 8 }}
{{- if $ownProxy }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: {{ $e.proxy.name }}
  namespace: {{ $e.namespace }}
  {{- with include "gateway.annotations" (dict "root" $ "extra" $e.proxy.annotations) | fromYaml }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- include "gateway.proxy.spec" (dict "proxy" $e.proxy "merge" false "renderMerge" false) | nindent 2 }}
{{- end }}
{{- if and (eq $e.health.protocol "HTTPS") $e.health.certificate.enabled }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $e.health.certificate.name }}
  namespace: {{ $e.namespace }}
  {{- with include "gateway.annotations" (dict "root" $ "extra" $e.health.certificate.annotations) | fromYaml }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $e.health.certificate.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  secretName: {{ $e.health.tls.secretName }}
  dnsNames:
    - {{ $e.health.hostname | quote }}
  {{- with $e.health.certificate.duration }}
  duration: {{ . }}
  {{- end }}
  {{- with $e.health.certificate.renewBefore }}
  renewBefore: {{ . }}
  {{- end }}
  {{- with $e.health.certificate.privateKey }}
  privateKey:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $e.health.certificate.usages }}
  usages:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  issuerRef:
    {{- toYaml $e.health.certificate.issuerRef | nindent 4 }}
{{- end }}
{{- if $e.clientTrafficPolicy.enabled }}
{{- $ctp := $e.clientTrafficPolicy }}
---
{{- /* The baseline for everything this exposure terminates. It targets the
       Gateway, so a ListenerSet attached to it inherits the same floor; a
       group that needs its own floor sets one on its ListenerSet. */}}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: {{ $ctp.name }}
  namespace: {{ $e.namespace }}
  {{- with include "gateway.annotations" (dict "root" $ "extra" $ctp.annotations) | fromYaml }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $ctp.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $e.gatewayName }}
  tls:
    minVersion: {{ $ctp.tls.minVersion | quote }}
    maxVersion: {{ $ctp.tls.maxVersion | quote }}
    {{- if $ctp.tls.clientValidation.enabled }}
    clientValidation:
      optional: {{ $ctp.tls.clientValidation.optional }}
      allowExpiredCertificate: {{ $ctp.tls.clientValidation.allowExpiredCertificate }}
      caCertificateRefs:
        {{- toYaml $ctp.tls.clientValidation.caCertificateRefs | nindent 8 }}
    {{- end }}
{{- end }}
{{- if $e.health.directResponse.enabled }}
{{- $dr := $e.health.directResponse }}
---
{{- /* An infrastructure health endpoint that answers without a backend: the
       exposure is reachable even when every workload behind it is down. */}}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: {{ $dr.filterName }}
  namespace: {{ $e.namespace }}
  {{- with include "gateway.annotations" (dict "root" $ "extra" $dr.annotations) | fromYaml }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $dr.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  directResponse:
    statusCode: {{ $dr.statusCode }}
    contentType: {{ $dr.contentType }}
    body:
      type: Inline
      inline: {{ $dr.body | quote }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $dr.routeName }}
  namespace: {{ $e.namespace }}
  {{- with include "gateway.annotations" (dict "root" $ "extra" $dr.annotations) | fromYaml }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $dr.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $e.gatewayName }}
      namespace: {{ $e.namespace }}
      sectionName: {{ $e.health.listenerName }}
  hostnames:
    - {{ $e.health.hostname | quote }}
  rules:
    - matches:
        - path:
            type: Exact
            value: {{ $dr.path }}
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: {{ $dr.filterName }}
{{- end }}
{{- end }}
{{- end }}
