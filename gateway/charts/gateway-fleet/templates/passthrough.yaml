{{- /* A TLS passthrough entry: a Gateway of a merged class whose one
       listener picks the stream by SNI and copies it, still encrypted, to a
       backend that terminates TLS itself. The proxy never holds the
       backend's key and never sees plaintext. It shares the fleet's port
       with the HTTPS listeners there; SNI keeps them apart. */}}
{{- range $name, $spec := .Values.passthroughs }}
{{- $p := include "gateway.passthrough.resolve" (dict "name" $name "spec" $spec) | fromYaml }}
{{- if $p.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $p.gatewayName }}
  namespace: {{ $p.namespace }}
  {{- with $p.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with include "gateway.annotations" (dict "root" $ "extra" $p.annotations) | fromYaml }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  gatewayClassName: {{ $p.class }}
  listeners:
    - name: {{ $p.listenerName }}
      protocol: TLS
      port: {{ $p.port }}
      hostname: {{ $p.hostname | quote }}
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: Same
        kinds:
          - group: gateway.networking.k8s.io
            kind: TLSRoute
---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: {{ $p.route.name }}
  namespace: {{ $p.namespace }}
  {{- with include "gateway.annotations" (dict "root" $ "extra" $p.route.annotations) | fromYaml }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $p.route.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $p.gatewayName }}
      sectionName: {{ $p.listenerName }}
  hostnames:
    - {{ $p.hostname | quote }}
  rules:
    - backendRefs:
        {{- /* group, kind and weight are server-defaulted; written out so
               a GitOps controller does not diff forever. */}}
        - group: ""
          kind: Service
          name: {{ $p.route.backend.name }}
          port: {{ $p.route.backend.port }}
          weight: {{ $p.route.backend.weight }}
{{- end }}
{{- end }}
