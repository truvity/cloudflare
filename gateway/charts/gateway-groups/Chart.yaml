apiVersion: v2
name: gateway-groups
description: >-
  Project groups on a shared Envoy Gateway exposure, in standard APIs only:
  one ListenerSet per group with a listener and a cert-manager Certificate
  per domain, an optional BackendTLSPolicy, and the ingress rule that lets
  the gateway reach the group's workloads. No vendor CRD, so a change of
  gateway implementation leaves this half untouched. Pairs with
  gateway-fleet, which owns the classes and the exposures.
type: application
