{{- $serviceIdentities := dict -}}
{{- $nodePortClaims := dict -}}
{{- $dnsLabelPattern := `^[a-z0-9]([-a-z0-9]*[a-z0-9])?$` -}}
{{/* Reserve the controller-created primary Service identity for each fleet. */}}
{{- range $fleetName, $fleetSpec := .Values.fleets -}}
{{- $f := include "fleet.resolve" (dict "name" $fleetName "spec" $fleetSpec) | fromYaml -}}
{{- if $f.envoyProxy.enabled -}}
{{- $identity := printf "Service/%s/%s" $f.namespace $f.envoyProxy.service.name -}}
{{- if hasKey $serviceIdentities $identity }}{{- fail (printf "duplicate fleet Service identity %s" $identity) }}{{- end -}}
{{- $_ := set $serviceIdentities $identity (printf "fleets.%s.envoyProxy.service" $fleetName) -}}
{{- end -}}
{{- end -}}

{{- range $fleetName, $fleetSpec := .Values.fleets }}
{{- $f := include "fleet.resolve" (dict "name" $fleetName "spec" $fleetSpec) | fromYaml }}
{{- range $exposureName, $exposureSpec := $f.additionalServices }}
{{- $s := include "fleet.additionalService.resolve" (dict "name" $exposureName "spec" $exposureSpec) | fromYaml }}
{{- if $s.enabled }}
{{- $path := printf "fleets.%s.additionalServices.%s" $fleetName $exposureName }}
{{- if or (gt (len $s.name) 63) (not (regexMatch $dnsLabelPattern $s.name)) }}{{- fail (printf "%s.name must be a valid DNS label no longer than 63 characters" $path) }}{{- end }}
{{- $identity := printf "Service/%s/%s" $f.namespace $s.name }}
{{- if hasKey $serviceIdentities $identity }}{{- fail (printf "duplicate rendered identity %s (%s and %s)" $identity (index $serviceIdentities $identity) $path) }}{{- end }}
{{- $_ := set $serviceIdentities $identity $path }}
{{- $isLoadBalancer := eq $s.type "LoadBalancer" }}
{{- $isExternallyAccessible := or $isLoadBalancer (eq $s.type "NodePort") }}
{{- if and (not $isLoadBalancer) (or $s.loadBalancerClass $s.loadBalancerSourceRanges $s.loadBalancerIP (hasKey $s "allocateLoadBalancerNodePorts") (gt (int $s.healthCheckNodePort) 0)) }}
{{- fail (printf "%s load-balancer fields require type LoadBalancer" $path) }}
{{- end }}
{{- if and $s.externalTrafficPolicy (not $isExternallyAccessible) }}{{- fail (printf "%s.externalTrafficPolicy requires type NodePort or LoadBalancer" $path) }}{{- end }}
{{- if and (gt (int $s.healthCheckNodePort) 0) (ne $s.externalTrafficPolicy "Local") }}{{- fail (printf "%s.healthCheckNodePort requires externalTrafficPolicy Local" $path) }}{{- end }}
{{- if gt (int $s.healthCheckNodePort) 0 }}
{{- $healthCheckClaim := printf "TCP/%v" $s.healthCheckNodePort }}
{{- $healthCheckPath := printf "%s.healthCheckNodePort" $path }}
{{- if hasKey $nodePortClaims $healthCheckClaim }}{{- fail (printf "%s duplicates Service nodePort %s already claimed by %s" $healthCheckPath $healthCheckClaim (index $nodePortClaims $healthCheckClaim)) }}{{- end }}
{{- $_ := set $nodePortClaims $healthCheckClaim $healthCheckPath }}
{{- end }}
{{- if and $s.sessionAffinityConfig (ne $s.sessionAffinity "ClientIP") }}{{- fail (printf "%s.sessionAffinityConfig requires sessionAffinity ClientIP" $path) }}{{- end }}
{{- $portNames := dict }}
{{- $portClaims := dict }}
{{- range $index, $port := $s.ports }}
{{- $portPath := printf "%s.ports[%d]" $path $index }}
{{- $portName := $port.name | default "" }}
{{- if and (gt (len $s.ports) 1) (not $portName) }}{{- fail (printf "%s.name is required when a Service has multiple ports" $portPath) }}{{- end }}
{{- if $portName }}
{{- if hasKey $portNames $portName }}{{- fail (printf "%s.name duplicates Service port name %s" $portPath $portName) }}{{- end }}
{{- $_ := set $portNames $portName true }}
{{- end }}
{{- $protocol := $port.protocol | default "TCP" }}
{{- $portClaim := printf "%s/%v" $protocol $port.port }}
{{- if hasKey $portClaims $portClaim }}{{- fail (printf "%s duplicates Service port %s" $portPath $portClaim) }}{{- end }}
{{- $_ := set $portClaims $portClaim true }}
{{- if hasKey $port "nodePort" }}
{{- if not $isExternallyAccessible }}{{- fail (printf "%s.nodePort requires type NodePort or LoadBalancer" $portPath) }}{{- end }}
{{- $nodePortClaim := printf "%s/%v" $protocol $port.nodePort }}
{{- if hasKey $nodePortClaims $nodePortClaim }}{{- fail (printf "%s.nodePort duplicates Service nodePort %s already claimed by %s" $portPath $nodePortClaim (index $nodePortClaims $nodePortClaim)) }}{{- end }}
{{- $_ := set $nodePortClaims $nodePortClaim (printf "%s.nodePort" $portPath) }}
{{- end }}
{{- end }}
{{- $serviceSpec := dict
  "type" $s.type
  "selector" (include "fleet.podLabels" (dict "name" $fleetName) | fromYaml)
  "ports" $s.ports -}}
{{- with $s.loadBalancerClass }}{{- $_ := set $serviceSpec "loadBalancerClass" . }}{{- end }}
{{- with $s.loadBalancerSourceRanges }}{{- $_ := set $serviceSpec "loadBalancerSourceRanges" . }}{{- end }}
{{- with $s.externalTrafficPolicy }}{{- $_ := set $serviceSpec "externalTrafficPolicy" . }}{{- end }}
{{- with $s.internalTrafficPolicy }}{{- $_ := set $serviceSpec "internalTrafficPolicy" . }}{{- end }}
{{- if hasKey $s "allocateLoadBalancerNodePorts" }}{{- $_ := set $serviceSpec "allocateLoadBalancerNodePorts" $s.allocateLoadBalancerNodePorts }}{{- end }}
{{- if hasKey $s "publishNotReadyAddresses" }}{{- $_ := set $serviceSpec "publishNotReadyAddresses" $s.publishNotReadyAddresses }}{{- end }}
{{- with $s.sessionAffinity }}{{- $_ := set $serviceSpec "sessionAffinity" . }}{{- end }}
{{- with $s.sessionAffinityConfig }}{{- $_ := set $serviceSpec "sessionAffinityConfig" . }}{{- end }}
{{- with $s.ipFamilyPolicy }}{{- $_ := set $serviceSpec "ipFamilyPolicy" . }}{{- end }}
{{- with $s.ipFamilies }}{{- $_ := set $serviceSpec "ipFamilies" . }}{{- end }}
{{- with $s.externalIPs }}{{- $_ := set $serviceSpec "externalIPs" . }}{{- end }}
{{- with $s.loadBalancerIP }}{{- $_ := set $serviceSpec "loadBalancerIP" . }}{{- end }}
{{- if $s.healthCheckNodePort }}{{- $_ := set $serviceSpec "healthCheckNodePort" $s.healthCheckNodePort }}{{- end }}
{{- with $s.trafficDistribution }}{{- $_ := set $serviceSpec "trafficDistribution" . }}{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $s.name }}
  namespace: {{ $f.namespace }}
  {{- with $s.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with include "fleet.annotations" (dict "root" $ "extra" $s.annotations) | fromYaml }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- toYaml $serviceSpec | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
