# envoy-gateway-fleet — the "fleet" half of an Envoy Gateway install.
#
# Upstream's gateway-helm chart installs the CONTROLLER. This chart owns the
# central fleet contract: GatewayClass, EnvoyProxy, central Gateways/listeners,
# Certificates, ClientTrafficPolicies, fleet NetworkPolicies, optional
# additional exposure Services, and optional infra direct-response health.
# GitOps supplies values and owns issuer/trust/approval, DNS, and Cloudflare or
# provider configuration. Project charts own business Routes, Services, and
# backend policies.
#
# Each fleet is one GatewayClass whose EnvoyProxy has mergeGateways on, so all
# Gateways naming that class collapse into one Envoy Deployment. The controller
# creates the stable primary Service; additionalServices can expose the same
# chart-selected fleet pods without embedding cloud-specific behavior here.

# The Envoy Gateway controller's name, as installed by gateway-helm.
controllerName: gateway.envoyproxy.io/gatewayclass-controller

# Annotations on every object this chart renders. Object annotations override
# matching common keys.
commonAnnotations: {}

# One entry per fleet; the key is the GatewayClass name. Every field below is
# shown with its default. A GatewayClass with envoyProxy.enabled: false is
# declared without parametersRef for backward compatibility.
