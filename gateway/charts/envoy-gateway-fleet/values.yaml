#      # EnvoyProxy field not modelled above.
#      extraSpec: {}
#    # A catch-all Gateway so the merged fleet always has ≥ 1 listener
#    # (an empty merged fleet has no Deployment at all). Give it a
#    # SPECIFIC hostname: a wildcard here conflicts with any wildcard
#    # listener a per-service Gateway brings (HostnameConflict).
#    healthListener:
#      enabled: false
#      name: ""                      # Gateway name; default: <fleet>
#      annotations: {}
#      listenerName: http
