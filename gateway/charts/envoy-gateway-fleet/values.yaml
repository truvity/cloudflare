# envoy-gateway-fleet — the "fleet" half of an Envoy Gateway install.
#
# Upstream's gateway-helm chart installs the CONTROLLER. This chart
# declares what the controller turns into running proxies: one fleet per
# audience (say `internal` for employees, `customer` for end users), each
# a GatewayClass whose EnvoyProxy has mergeGateways on — so every
# per-service Gateway that names the class collapses into ONE Envoy
# Deployment behind ONE stable Service. Whatever fronts the cluster (a
# Cloudflare tunnel, a load balancer) targets that Service and never
# changes when services come and go.
#
# Per-service Gateways and HTTPRoutes are NOT here: they live with the
# service that owns them. This chart is the audience-level contract only.

# The Envoy Gateway controller's name, as installed by gateway-helm.
controllerName: gateway.envoyproxy.io/gatewayclass-controller

# Annotations on every object this chart renders (an Argo CD sync-wave,
# say). Each object also accepts its own `annotations`, merged on top.
commonAnnotations: {}

# One entry per fleet; the key is the GatewayClass name. Every field
# below is shown with its default — a fleet needs only the ones it
# changes. A GatewayClass with `envoyProxy.enabled: false` is declared
# without parametersRef (a class reserved for later, or one whose
# EnvoyProxy is managed elsewhere).
fleets: {}
#  internal:
