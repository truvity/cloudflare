apiVersion: v2
name: envoy-gateway-fleet
description: >-
  Envoy Gateway fleets — per-audience GatewayClass + EnvoyProxy
  (mergeGateways: one Envoy fleet), compatibility health, central exact or
  opt-in wildcard listeners with Certificate and ClientTrafficPolicy resources,
  chart-owned additional exposure Services, optional infra direct-response
  health, and the fleet NetworkPolicy. The controller itself is upstream's chart.
