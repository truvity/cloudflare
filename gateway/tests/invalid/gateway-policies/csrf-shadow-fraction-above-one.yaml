defaults:
  oidc: {issuer: https://id.example.com}
securityPolicies:
  console:
    namespace: example
    targetRefs: [{name: console}]
    oidc:
      clientID: console
      clientSecret: {name: console-client}
      hostname: console.example.com
    csrf: {shadowFraction: {numerator: 150, denominator: 100}}
