# Two Certificates reconciling one Secret: the survivor is a race.
defaults:
  parent: {name: public}
  certificate: {issuerRef: {name: ca}}
groups:
  one:
    domains:
      - host: a.example.com
        secretName: shared-tls
  two:
    domains:
      - host: b.example.com
        secretName: shared-tls
