---
# Source: envoy-gateway-fleet/templates/listeners.yaml
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: private-entrypoint-tls
  namespace: application-gateway
  annotations:
    example.com/managed-by: fleet-registry
    example.com/sync-wave: "64"
spec:
  secretName: private-entrypoint-tls
  dnsNames:
    - gateway.internal.example.com
  duration: "720h"
  renewBefore: "240h"
  privateKey:
    algorithm: ECDSA
    rotationPolicy: Always
    size: 384
  usages:
    - server auth
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: application-server

---
# Source: envoy-gateway-fleet/templates/listeners.yaml
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: private-entrypoint-tls
  namespace: application-gateway
  annotations:
    example.com/managed-by: fleet-registry
    example.com/sync-wave: "66"
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: private-entrypoint
      sectionName: https
  tls:
    maxVersion: "1.3"
    minVersion: "1.3"

---
# Source: envoy-gateway-fleet/templates/envoyproxy.yaml
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: internal-config
  namespace: envoy-gateway-system
  annotations:
    example.com/managed-by: fleet-registry
spec:
  mergeGateways: true
  provider:
    kubernetes:
      envoyDeployment:
        replicas: 2
      envoyPDB:
        minAvailable: 1
      envoyService:
        name: gateway-internal
        type: ClusterIP
    type: Kubernetes

---
# Source: envoy-gateway-fleet/templates/listeners.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: private-entrypoint
  namespace: application-gateway
  labels:
    example.com/tls-baseline: strict
  annotations:
    example.com/managed-by: fleet-registry
spec:
  gatewayClassName: internal
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: private-entrypoint-tls
      hostname: "gateway.internal.example.com"
      allowedRoutes:
        namespaces:
          from: Same

---
# Source: envoy-gateway-fleet/templates/listeners.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal-status
  namespace: envoy-gateway-system
  annotations:
    example.com/managed-by: fleet-registry
spec:
  gatewayClassName: internal
  listeners:
    - name: http
      protocol: HTTP
      port: 8080
      hostname: "status.internal.example.com"
      allowedRoutes:
        namespaces:
          from: All

---
# Source: envoy-gateway-fleet/templates/gatewayclass.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: internal
  annotations:
    example.com/managed-by: fleet-registry
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: internal-config
    namespace: envoy-gateway-system
