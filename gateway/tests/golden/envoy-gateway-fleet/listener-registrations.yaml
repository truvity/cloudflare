---
# Source: envoy-gateway-fleet/templates/additional-services.yaml
apiVersion: v1
kind: Service
metadata:
  name: private-network-load-balancer
  namespace: envoy-gateway-system
  labels:
    example.com/owner: platform
  annotations:
    example.com/exposure: private
    example.com/load-balancer-kind: network
    example.com/managed-by: fleet-registry
spec:
  allocateLoadBalancerNodePorts: true
  externalTrafficPolicy: Local
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  loadBalancerClass: example.com/network-load-balancer
  loadBalancerSourceRanges:
  - 192.0.2.0/24
  - 198.51.100.32/27
  ports:
  - name: https
    port: 443
    protocol: TCP
    targetPort: 10443
  selector:
    app.kubernetes.io/name: envoy
    gateway.envoyproxy.io/owning-gatewayclass: internal
  type: LoadBalancer

---
# Source: envoy-gateway-fleet/templates/listeners.yaml
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: private-entrypoint-tls
  namespace: application-gateway
  annotations:
    example.com/managed-by: fleet-registry
    example.com/sync-wave: "64"
spec:
  secretName: private-entrypoint-tls
  dnsNames:
    - "gateway.internal.example.com"
  duration: "720h"
  renewBefore: "240h"
  privateKey:
    algorithm: ECDSA
    rotationPolicy: Always
    size: 384
  usages:
    - server auth
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: application-server

---
# Source: envoy-gateway-fleet/templates/listeners.yaml
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: internal-wildcard-observability-tls
  namespace: envoy-gateway-system
  annotations:
    example.com/managed-by: fleet-registry
spec:
  secretName: internal-wildcard-observability-tls
  dnsNames:
    - "*.ops.internal.example.com"
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: wildcard-issuer

---
# Source: envoy-gateway-fleet/templates/listeners.yaml
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: private-entrypoint-tls
  namespace: application-gateway
  annotations:
    example.com/managed-by: fleet-registry
    example.com/sync-wave: "66"
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: private-entrypoint
      sectionName: https
  tls:
    maxVersion: "1.3"
    minVersion: "1.3"

---
# Source: envoy-gateway-fleet/templates/envoyproxy.yaml
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: internal-config
  namespace: envoy-gateway-system
  annotations:
    example.com/managed-by: fleet-registry
spec:
  mergeGateways: true
  provider:
    kubernetes:
      envoyDeployment:
        replicas: 2
      envoyPDB:
        minAvailable: 1
      envoyService:
        name: gateway-internal
        type: ClusterIP
    type: Kubernetes

---
# Source: envoy-gateway-fleet/templates/listeners.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: private-entrypoint
  namespace: application-gateway
  labels:
    example.com/tls-baseline: strict
  annotations:
    example.com/managed-by: fleet-registry
spec:
  gatewayClassName: internal
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: private-entrypoint-tls
      hostname: "gateway.internal.example.com"
      allowedRoutes:
        kinds:
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
        - group: gateway.networking.k8s.io
          kind: GRPCRoute
        namespaces:
          from: Selector
          selector:
            matchExpressions:
            - key: tenancy.example.com/tier
              operator: In
              values:
              - application
              - platform
            - key: tenancy.example.com/suspended
              operator: DoesNotExist
            matchLabels:
              tenancy.example.com/audience: internal
              tenancy.example.com/state: active

---
# Source: envoy-gateway-fleet/templates/listeners.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal-status
  namespace: envoy-gateway-system
  annotations:
    example.com/managed-by: fleet-registry
spec:
  gatewayClassName: internal
  listeners:
    - name: http
      protocol: HTTP
      port: 8080
      hostname: "status.internal.example.com"
      allowedRoutes:
        kinds:
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
        namespaces:
          from: Same

