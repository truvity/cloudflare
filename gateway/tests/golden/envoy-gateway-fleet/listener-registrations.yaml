        kinds:
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
        namespaces:
          from: Same

---
# Source: envoy-gateway-fleet/templates/listeners.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal-wildcard-root
  namespace: envoy-gateway-system
  annotations:
    example.com/managed-by: fleet-registry
spec:
  gatewayClassName: internal
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
