---
# Source: envoy-gateway-fleet/templates/gatewayclass.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: internal
  annotations:
    example.com/managed-by: fleet-registry
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: internal-config
    namespace: envoy-gateway-system

---
# Source: envoy-gateway-fleet/templates/listeners.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: internal-status-health
  namespace: envoy-gateway-system
  labels:
    example.com/owner: platform
  annotations:
    example.com/managed-by: fleet-registry
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal-status
      sectionName: http
  hostnames:
    - "status.internal.example.com"
  rules:
    - matches:
        - path:
            type: Exact
            value: "/ready"
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: internal-status-health

---
# Source: envoy-gateway-fleet/templates/listeners.yaml
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: internal-status-health
  namespace: envoy-gateway-system
  labels:
    example.com/owner: platform
  annotations:
    example.com/managed-by: fleet-registry
spec:
  directResponse:
    contentType: "application/json"
    statusCode: 200
    body:
      type: Inline
      inline: "{\"status\":\"ok\"}"
