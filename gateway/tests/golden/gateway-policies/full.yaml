---
# Source: gateway-policies/templates/security-policies.yaml
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: admin
  namespace: example-admin
  annotations:
    example.com/sync-wave: "70"
spec:
  authorization:
    defaultAction: Deny
    rules:
    - action: Allow
      name: allow-groups
      principal:
        jwt:
          claims:
          - name: groups
            valueType: StringArray
            values:
            - example-admins
          provider: example-id
  csrf:
    additionalOrigins:
    - https://portal.example.com
  jwt:
    providers:
    - audiences:
      - example-admin
      claimToHeaders:
      - claim: sub
        header: x-auth-request-user
      - claim: email
        header: x-auth-request-email
      extractFrom:
        headers:
        - name: x-example-id-token
      issuer: https://id.example.com
      name: example-id
      remoteJWKS:
        backendRefs:
        - group: ""
          kind: Service
          name: issuer
          namespace: example-id
          port: 8080
        cacheDuration: 300s
        uri: https://id.example.com/keys
  oidc:
    clientID: example-admin
    clientSecret:
      group: ""
      kind: Secret
      name: example-admin-client
    cookieConfig:
      sameSite: Strict
    forwardIDToken:
      header: x-example-id-token
    logoutPath: /_auth/logout
    provider:
      authorizationEndpoint: https://id.example.com/authorize
      endSessionEndpoint: https://id.example.com/end_session
      issuer: https://id.example.com
      tokenEndpoint: https://id.example.com/token
    redirectURL: https://admin.example.com/_auth/callback
    refreshToken: true
    scopes:
    - openid
    - email
    - profile
    - offline_access
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: admin

