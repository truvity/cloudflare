# Source: gateway-policies/templates/security-policies.yaml
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: api
  namespace: example-api
  annotations:
    example.com/sync-wave: "70"
spec:
  authorization:
    defaultAction: Deny
    rules:
    - action: Allow
      name: allow-groups
      principal:
        jwt:
          claims:
          - name: groups
            valueType: StringArray
            values:
            - example-api-callers
          provider: jwt
  jwt:
    providers:
    - audiences:
      - example-api
      claimToHeaders:
      - claim: azp
        header: x-client-id
      issuer: https://id.example.com
      name: jwt
      remoteJWKS:
        cacheDuration: 300s
        uri: https://id.example.com/keys
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: GRPCRoute
    name: api

---
# Source: gateway-policies/templates/security-policies.yaml
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: console
  namespace: example-console
  annotations:
    example.com/sync-wave: "70"
spec:
  csrf:
    shadowFraction:
      denominator: 100
      numerator: 100
  jwt:
    providers:
    - audiences:
      - example-console
      claimToHeaders:
      - claim: sub
        header: x-auth-request-user
      - claim: email
        header: x-auth-request-email
      extractFrom:
        headers:
        - name: x-example-id-token
      issuer: https://id.example.com
      name: example-id
      remoteJWKS:
        backendRefs:
        - group: ""
          kind: Service
          name: issuer
          namespace: example-id
          port: 8080
        cacheDuration: 300s
        uri: https://id.example.com/keys
  oidc:
    clientID: example-console
    clientSecret:
      group: ""
      kind: Secret
      name: example-console-client
    cookieConfig:
      sameSite: Lax
    forwardAccessToken: true
    forwardIDToken:
      header: x-example-id-token
    logoutPath: /oauth2/logout
    provider:
      authorizationEndpoint: https://id.example.com/authorize
      endSessionEndpoint: https://id.example.com/end_session
      issuer: https://id.example.com
      tokenEndpoint: https://id.example.com/token
    redirectURL: https://console.example.com/oauth2/callback
    refreshToken: true
    scopes:
    - openid
    - email
    - profile
    - offline_access
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: console
