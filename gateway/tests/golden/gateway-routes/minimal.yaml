---
# Source: gateway-routes-harness/templates/routes.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: example-app
  namespace: default
spec:
  hostnames:
  - app.example
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: ListenerSet
    name: example
    namespace: gateways
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: example-app
      port: 8080
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
    name: app
