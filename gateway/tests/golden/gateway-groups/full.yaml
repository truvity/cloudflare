---
# Source: gateway-groups/templates/listenerset.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: argocd
  namespace: envoy-gateway-system
  annotations:
    example.com/sync-wave: "70"
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: public
    namespace: envoy-gateway-system
  listeners:
    - allowedRoutes:
        kinds:
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway.example.com/route-grant-argocd: "true"
      hostname: argocd.example.com
      name: argocd-example-com
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
        - group: ""
          kind: Secret
          name: argocd-example-com-tls
        mode: Terminate
    - allowedRoutes:
        kinds:
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway.example.com/route-grant-argocd: "true"
      hostname: argocd.old.example.com
      name: legacy
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
        - group: ""
          kind: Secret
          name: argocd-legacy-tls
        mode: Terminate

