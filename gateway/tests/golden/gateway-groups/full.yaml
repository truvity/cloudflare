---
# Source: gateway-groups/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-store
  namespace: example-store
  annotations:
    example.com/sync-wave: "70"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: store
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: envoy
              gateway.envoyproxy.io/owning-gateway-name: private
      ports:
        - port: 8200
          protocol: TCP

---
# Source: gateway-groups/templates/backendtlspolicy.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: store
  namespace: envoy-gateway-system
  annotations:
    example.com/sync-wave: "70"
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: store
      sectionName: https
  validation:
    caCertificateRefs:
    - group: ""
      kind: ConfigMap
      name: example-trust-bundle
    hostname: store.example-store.svc

---
# Source: gateway-groups/templates/certificate.yaml
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-example-com-tls
  namespace: envoy-gateway-system
  annotations:
    example.com/sync-wave: "70"
spec:
  secretName: argocd-example-com-tls
  dnsNames:
    - "argocd.example.com"
  duration: 720h
  renewBefore: 240h
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: example-ca

