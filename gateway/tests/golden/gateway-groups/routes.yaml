# Source: gateway-groups/templates/httproute.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: console
  namespace: example-console
  annotations:
    example.com/sync-wave: "66"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: console
      namespace: envoy-gateway-system
  hostnames:
    - console.example.com
  rules:
    - backendRefs:
      - group: ""
        kind: Service
        name: console
        port: 8080
        weight: 1
      matches:
      - path:
          type: PathPrefix
          value: /
      name: app

---
# Source: gateway-groups/templates/httproute.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: portal
  namespace: example-portal
  annotations:
    example.com/sync-wave: "66"
  labels:
    app.kubernetes.io/name: portal
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: portal
      namespace: envoy-gateway-system
  hostnames:
    - portal.example.com
  rules:
    - backendRefs:
      - group: ""
        kind: Service
        name: portal-api
        port: 80
        weight: 1
      matches:
      - path:
          type: Exact
          value: /login
        queryParams:
        - name: code
          type: RegularExpression
          value: .+
    - filters:
      - requestRedirect:
          path:
            replaceFullPath: /
            type: ReplaceFullPath
          statusCode: 302
        type: RequestRedirect
      matches:
      - path:
          type: Exact
          value: /login
    - backendRefs:
      - group: ""
        kind: Service
        name: portal-api
        port: 80
        weight: 1
      matches:
      - path:
          type: PathPrefix
          value: /
      timeouts:
        request: 30s

