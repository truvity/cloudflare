# Source: gateway-groups/templates/listenerset.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: console
  namespace: envoy-gateway-system
  annotations:
    example.com/sync-wave: "66"
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: private
    namespace: envoy-gateway-system
  listeners:
    - allowedRoutes:
        kinds:
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway.example.com/route-grant: "true"
      hostname: console.example.com
      name: console-example-com
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
        - group: ""
          kind: Secret
          name: console-example-com-tls
        mode: Terminate

