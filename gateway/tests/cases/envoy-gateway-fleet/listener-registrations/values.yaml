commonAnnotations:
  example.com/managed-by: fleet-registry
fleets:
  internal:
    listeners:
      private-entrypoint:
        namespace: application-gateway
        gatewayName: private-entrypoint
        labels:
          example.com/tls-baseline: strict
        hostname: gateway.internal.example.com
        certificate:
          annotations:
            example.com/sync-wave: "64"
          issuerRef:
            name: application-server
            kind: Issuer
            group: cert-manager.io
          duration: 720h
          renewBefore: 240h
          privateKey:
            algorithm: ECDSA
            size: 384
            rotationPolicy: Always
          usages:
            - server auth
        clientTrafficPolicy:
          enabled: true
          annotations:
            example.com/sync-wave: "66"
          tls:
            minVersion: "1.3"
            maxVersion: "1.3"
      status:
        protocol: HTTP
        port: 8080
        hostname: status.internal.example.com
        certificate:
          enabled: false
        allowedRoutes:
          namespaces:
            from: All
