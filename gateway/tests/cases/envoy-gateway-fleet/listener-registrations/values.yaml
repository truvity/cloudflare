commonAnnotations:
  example.com/managed-by: fleet-registry
fleets:
  internal:
    additionalServices:
      private-network-load-balancer:
        type: LoadBalancer
        loadBalancerClass: example.com/network-load-balancer
        annotations:
          example.com/exposure: private
          example.com/load-balancer-kind: network
        labels:
          example.com/owner: platform
        loadBalancerSourceRanges:
          - 192.0.2.0/24
          - 198.51.100.32/27
        externalTrafficPolicy: Local
        allocateLoadBalancerNodePorts: true
        ipFamilyPolicy: SingleStack
        ipFamilies: [IPv4]
        ports:
          - name: https
            port: 443
            protocol: TCP
            targetPort: 10443
    listeners:
      private-entrypoint:
        namespace: application-gateway
        gatewayName: private-entrypoint
        labels:
          example.com/tls-baseline: strict
        hostname: gateway.internal.example.com
        certificate:
          annotations:
            example.com/sync-wave: "64"
          issuerRef:
            name: application-server
            kind: Issuer
            group: cert-manager.io
          duration: 720h
          renewBefore: 240h
          privateKey:
            algorithm: ECDSA
            size: 384
            rotationPolicy: Always
          usages:
            - server auth
        allowedRoutes:
          namespaces:
            from: Selector
            selector:
              matchLabels:
                tenancy.example.com/audience: internal
                tenancy.example.com/state: active
              matchExpressions:
                - key: tenancy.example.com/tier
                  operator: In
                  values: [application, platform]
                - key: tenancy.example.com/suspended
                  operator: DoesNotExist
          kinds:
            - group: gateway.networking.k8s.io
              kind: HTTPRoute
            - group: gateway.networking.k8s.io
              kind: GRPCRoute
        clientTrafficPolicy:
          enabled: true
          annotations:
            example.com/sync-wave: "66"
          tls:
            minVersion: "1.3"
            maxVersion: "1.3"
      wildcard-root:
        hostname: "*.internal.example.com"
        allowWildcard: true
        certificate: {enabled: false}
      wildcard-observability:
        hostname: "*.ops.internal.example.com"
        allowWildcard: true
        certificate:
          issuerRef:
            name: wildcard-issuer
            kind: ClusterIssuer
            group: cert-manager.io
      status:
        protocol: HTTP
        port: 8080
        hostname: status.internal.example.com
        certificate:
          enabled: false
        allowedRoutes:
          namespaces:
            from: Same
        infraHealth:
          enabled: true
          path: /ready
          statusCode: 200
          contentType: application/json
          body: '{"status":"ok"}'
          labels:
            example.com/owner: platform
