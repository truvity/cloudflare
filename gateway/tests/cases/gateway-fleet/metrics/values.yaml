# Scraping the fleet: a PodMonitor for the proxies and one for the
# controller, the default keep list, one extra rule after it, and the
# ingress row that admits the scraper on every exposure's NetworkPolicy.
# A merged class with a second namespace shows one proxy monitor per
# namespace that holds a proxy.
commonAnnotations:
  example.com/sync-wave: "65"

classes:
  internal:
    mergeGateways: true
    proxy:
      service:
        name: gateway-internal
  edge:
    namespace: edge-system
    mergeGateways: true
    proxy:
      service:
        name: gateway-edge

exposures:
  public:
    class: internal
    health:
      hostname: gateway-health.example.com
      certificate:
        issuerRef:
          name: example-ca
          kind: ClusterIssuer
          group: cert-manager.io
    networkPolicy:
      enabled: true
      ingress:
        - from:
            - ipBlock:
                cidr: 10.0.0.0/8
          ports:
            - port: 10443
              protocol: TCP

metrics:
  podMonitor:
    enabled: true
    interval: 30s
    labels:
      release: example
    proxy:
      metricRelabelings:
        - action: labeldrop
          regex: envoy_response_code_class
  networkPolicy:
    from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: monitoring
        podSelector:
          matchLabels:
            app.kubernetes.io/name: vmagent
