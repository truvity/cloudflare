# The worked example: one estate with an OIDC issuer, a console for people,
# an admin console for one group, a machine API, a listener that accepts
# only TLS 1.3, and a backend with a private-chain certificate.
commonAnnotations:
  example.com/sync-wave: "70"

# The floor on every Gateway in two namespaces. A Gateway that needs
# something else carries the label `tls-baseline-exempt`.
tlsBaseline:
  namespaces:
    - gateways
    - example-tools
  annotations:
    example.com/sync-wave: "66"

# One listener held to TLS 1.3 only.
tlsPolicies:
  strict-listener:
    namespace: gateways
    targetRefs:
      - name: public
        sectionName: partners
    tls:
      minVersion: "1.3"
      maxVersion: "1.3"

# Shared by every protected route.
defaults:
  oidc:
    issuer: https://id.example.com
    authorizationEndpoint: https://id.example.com/authorize
    tokenEndpoint: https://id.example.com/token
    endSessionEndpoint: https://id.example.com/end_session
    scopes: [openid, email, profile, offline_access]
    idToken:
      enabled: true
      header: x-example-id-token
      providerName: example-id
      remoteJWKS:
        uri: https://id.example.com/keys
        # Keys from the issuer's Service next door, not through the edge.
        backendRefs:
          - name: issuer
            namespace: example-id
            port: 8080
      claimToHeaders:
        - header: x-auth-request-user
          claim: sub
        - header: x-auth-request-email
          claim: email
  jwt:
    issuer: https://id.example.com
    remoteJWKS:
      uri: https://id.example.com/keys

securityPolicies:
  # A console anyone signed in may use. CSRF is in shadow (the default for
  # a cookie-authenticated route): every request is counted, none refused.
  console:
    namespace: example-console
    targetRefs:
      - name: console
    oidc:
      clientID: example-console
      clientSecret:
        name: example-console-client
      hostname: console.example.com
      forwardAccessToken: true

  # An admin console for one group, CSRF enforced, one partner origin
  # allowed to post.
  admin:
    namespace: example-admin
    targetRefs:
      - name: admin
    oidc:
      clientID: example-admin
      clientSecret:
        name: example-admin-client
      hostname: admin.example.com
      pathPrefix: /_auth
      cookieSameSite: Strict
    authorization:
      posture: groups
      groups:
        - example-admins
    csrf:
      mode: enforce
      additionalOrigins:
        - https://portal.example.com

  # A machine API: bearer tokens for one audience, no CSRF (machine
  # clients send no Origin), one group allowed.
  api:
    type: jwt
    namespace: example-api
    targetRefs:
      - kind: GRPCRoute
        name: api
    jwt:
      audiences:
        - example-api
      claimToHeaders:
        - header: x-client-id
          claim: azp
    authorization:
      posture: groups
      groups:
        - example-api-callers

# A backend whose certificate chains to a private CA in a ConfigMap, and
# one that the proxy's system trust store verifies.
backendTLSPolicies:
  store:
    namespace: example-store
    targetRefs:
      - name: store
        sectionName: https
    hostname: store.example-store.svc
    caCertificateRefs:
      - kind: ConfigMap
        name: example-trust-bundle
  vault:
    namespace: example-vault
    annotations:
      example.com/sync-wave: "71"
    targetRefs:
      - name: vault
    hostname: vault.example.internal
    wellKnownCACertificates: System
    subjectAltNames:
      - type: Hostname
        hostname: vault.example.internal
