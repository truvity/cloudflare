# Tag-triggered release — the shared implementation (truvity/ci-workflows).
# goreleaser builds the r2broker binary and image (see .goreleaser.yaml)
# and makes the GitHub Release; every chart listed below is packaged at
# the tag's version and pushed to oci://ghcr.io/truvity/charts/<chart>.
#
# The caller grants the permissions because a reusable workflow can
# narrow them but never widen them.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

# Never cancel a running publish — a half-pushed artifact set is worse
# than a queued wait.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      packages: write
    uses: truvity/ci-workflows/.github/workflows/release-public.yaml@58d470dff71c732e208f47a80bb6c5d741e016a7 # v3.25.0
    with:
      charts: '["cloudflared", "r2-broker"]'
      # ko names the image after cmd/r2broker's own directory
      # (base_import_paths in .goreleaser.yaml), so this nests it as
      # ghcr.io/truvity/cloudflare/r2broker.
      ko-docker-repo: ghcr.io/truvity/cloudflare
