name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * *" # daily 6am UTC

permissions:
  contents: read

jobs:
  govulncheck:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@ee73220eb9cb488f4a19f636307cddc85fc602bc # v2.16.1
    with:
      recipes: '["vuln"]'
