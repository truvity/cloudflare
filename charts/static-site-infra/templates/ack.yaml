{{- /*
The ACK-managed AWS identity of a static-site install (EKS Pod Identity), moved
here from the static-site chart with the same names and the same rendered
objects, so the live ones do not change:
  - Policy (wave -30): the ECR actions the server calls, from internal/staticsite
    (ecrpermissions.go); a Go test compares them with this render
  - Role (-25): trusts pods.eks.amazonaws.com for this namespace and ServiceAccount
  - PodIdentityAssociation (-20): binds the ServiceAccount to the Role
  - ServiceAccount (-15, serviceaccount.yaml): after the association
The static-site chart only names the ServiceAccount and checks, in a hook,
that a pod admitted now has the identity (platform contract rule 11).

Policy, Role and PodIdentityAssociation carry `argocd.argoproj.io/sync-options:
Prune=false,Delete=false`, like the ServiceAccount. During the handover from
static-site v3.11 the live objects are still tracked by the site's Application,
which refreshes independently and may re-take tracking; its sync, no longer
rendering them, would prune them and ACK would delete the IAM Role. Argo CD
reads the sync option from the LIVE object when it prunes, and under
server-side apply the previous owner cannot strip an annotation it never owned,
so the guard holds whichever Application syncs. `Delete=false` also keeps the
IAM Role if this Application is deleted: the same posture as the ServiceAccount.

Policy and Role are adopt-or-create (`services.k8s.aws/adoption-policy`, ACK
feature gate ResourceAdoption): a policy or role name is unique, so adopting the
one that already exists under it is safe. This recovers a create that was
refused ("Resource already exists", ACK.Terminal) because an earlier attempt
reached AWS before ACK could finish (for example while the ACK ceiling role was
missing), and the Role and association that reference the Policy then stay
blocked. PodIdentityAssociation is NOT adopted. WHY: an association is
identified in AWS by (EKS cluster, namespace, ServiceAccount), not by the
object. With adoption a new object adopts the existing association of that
triple; when the legacy object that also owns it is pruned, its controller
deletes the association in AWS, and the workload is left with none while the new
object still reports Synced. Without adoption the create is refused while
another association holds the triple, which is the signal to remove that one
first.
*/}}
{{- include "static-site-infra.validate" . }}
{{- if include "static-site-infra.enabled" . }}
{{- $ack := .Values.registry.ack }}
{{- $name := include "static-site-infra.ackName" . }}
---
apiVersion: iam.services.k8s.aws/v1alpha1
kind: Policy
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "static-site-infra.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    services.k8s.aws/adoption-policy: adopt-or-create
spec:
  name: {{ $name }}
  description: "static-site {{ .Release.Namespace }}/{{ include "static-site-infra.installName" . }}: ECR pull access"
  policyDocument: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": ["ecr:GetAuthorizationToken"],
          "Resource": "*"
        },
        {
          "Effect": "Allow",
          "Action": [
            "ecr:BatchGetImage",
            "ecr:GetDownloadUrlForLayer",
            "ecr:BatchCheckLayerAvailability"
          ],
          "Resource": {{ $ack.repositoryArns | toJson }}
        }
      ]
    }
---
apiVersion: iam.services.k8s.aws/v1alpha1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "static-site-infra.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-25"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    services.k8s.aws/adoption-policy: adopt-or-create
spec:
  name: {{ $name }}
  description: "static-site {{ .Release.Namespace }}/{{ include "static-site-infra.installName" . }}: workload role"
  {{- with $ack.permissionsBoundary }}
  permissionsBoundary: {{ . }}
  {{- end }}
  tags:
    - key: cluster
      value: {{ $ack.clusterName | quote }}
    {{- range $k, $v := omit (default dict $ack.tags) "cluster" }}
    - key: {{ $k | quote }}
      value: {{ $v | quote }}
    {{- end }}
  assumeRolePolicyDocument: |
    {
      "Version": "2012-10-17",
      "Statement": [{
        "Effect": "Allow",
        "Principal": {"Service": "pods.eks.amazonaws.com"},
        "Action": ["sts:AssumeRole", "sts:TagSession"],
        "Condition": {
          "StringEquals": {
            {{- if $ack.accountId }}
            "aws:SourceAccount": {{ $ack.accountId | quote }},
            "aws:SourceArn": {{ printf "arn:aws:eks:%s:%s:cluster/%s" $ack.region $ack.accountId $ack.clusterName | quote }},
            {{- end }}
            "aws:RequestTag/kubernetes-namespace": {{ .Release.Namespace | quote }},
            "aws:RequestTag/kubernetes-service-account": {{ include "static-site-infra.serviceAccountName" . | quote }}
          }
        }
      }]
    }
  policyRefs:
    - from:
        name: {{ $name }}
---
apiVersion: eks.services.k8s.aws/v1alpha1
kind: PodIdentityAssociation
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "static-site-infra.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  clusterName: {{ $ack.clusterName }}
  namespace: {{ .Release.Namespace }}
  serviceAccount: {{ include "static-site-infra.serviceAccountName" . }}
  roleRef:
    from:
      name: {{ $name }}
{{- end }}
