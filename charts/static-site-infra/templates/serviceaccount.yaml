{{- /*
The ServiceAccount the association binds, in a LATER sync wave than the
association: role, then binding, then account. Kubernetes refuses a pod whose
account does not exist, so the site's pods wait for the identity.

It is the object the static-site chart used to render: the same name and
labels. `Prune=false,Delete=false` stays on it for good (the two charts are
applied by one field manager, so an apply from either that left the guard out
would remove it from the live object, and a deleted account is a new uid,
which invalidates the token a running pod holds). The guard and the wave win
over serviceAccount.annotations.
*/}}
{{- if and (include "static-site-infra.enabled" .) .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "static-site-infra.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "static-site-infra.labels" . | nindent 4 }}
  annotations:
    {{- $annotations := merge (dict "argocd.argoproj.io/sync-options" "Prune=false,Delete=false" "argocd.argoproj.io/sync-wave" "-15") (deepCopy (default dict .Values.serviceAccount.annotations)) }}
    {{- range $k, $v := $annotations }}
    {{ $k | quote }}: {{ $v | quote }}
    {{- end }}
{{- end }}
