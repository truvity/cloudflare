{{- with .Values.placeholders.externalSecret }}
{{- include "static-site.validateExternalSecret" $ }}
{{- $ignore := true }}
{{- if hasKey . "ignoreHealthcheck" }}{{ $ignore = .ignoreHealthcheck }}{{ end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $.Values.placeholders.secretName }}
  namespace: {{ $.Release.Namespace }}
  {{- $annotations := merge (dict) (default dict .annotations) }}
  {{- if $ignore }}{{ $_ := set $annotations "argocd.argoproj.io/ignore-healthcheck" "true" }}{{ end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  refreshInterval: {{ default "1h" .refreshInterval }}
  secretStoreRef:
    kind: {{ .storeRef.kind }}
    name: {{ .storeRef.name }}
  target:
    name: {{ $.Values.placeholders.secretName }}
    creationPolicy: Owner
  data:
    {{- range $key := keys .properties | sortAlpha }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $.Values.placeholders.externalSecret.remoteKey }}
        property: {{ get $.Values.placeholders.externalSecret.properties $key }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    {{- end }}
{{- end }}
