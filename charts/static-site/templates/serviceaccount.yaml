{{- /*
Not rendered when the identity is managed (registry.auth=ecr and
registry.ack.enabled): the account belongs to static-site-infra, rendered
after the Pod Identity association, and this chart only names it.
*/}}
{{- if and .Values.serviceAccount.create (not (include "static-site.identityManaged" .)) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "static-site.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "static-site.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- if ne .Values.registry.auth "ecr" }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
