{{- /*
Proof that a pod admitted now gets the site's cloud identity, before the
Deployment exists (truvity/policy service-lib's identityCheck; decision 0013:
https://github.com/truvity/policy/blob/v1.51.0/docs/decisions/0013-pods-are-admitted-with-their-identity.md).

A pre-install,pre-upgrade hook Job that runs as the site's ServiceAccount,
which static-site-infra renders and which must already exist. Rendered exactly
when the identity is managed (registry.auth=ecr and registry.ack.enabled);
there is no switch.

The library labels the check pod from the including chart's name and
`<component>-identity-check`, and this chart's selectors carry the chart name
and the release only. The check is therefore given a chart name of its own
(`static-site-identity-check`), so that no Service, PodDisruptionBudget or
NetworkPolicy of the site selects it: a Job pod with no readiness probe is
Ready while it runs. Its egress policy is static-site-infra's
(networkPolicy.enabled).
*/}}
{{- if include "static-site.identityManaged" . }}
{{- $ctx := dict "Release" .Release "Values" .Values "Chart" (dict "Name" (printf "%s-identity-check" .Chart.Name) "AppVersion" .Chart.AppVersion) }}
{{- $platform := dict "serviceAccount" (dict "name" (include "static-site.serviceAccountName" .)) }}
---
{{ include "service-lib.identityCheck" (dict "context" $ctx "name" (include "static-site.name" .) "platform" $platform "cloudIdentity" true) }}
{{- end }}
