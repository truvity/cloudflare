# static-site: one generic server, one site per install.

nameOverride: ""
fullnameOverride: ""

replicaCount: 2

# The server image. The tag defaults to the chart's appVersion, which the
# release stamps with the release version: chart and image never disagree.
image:
  repository: ghcr.io/truvity/edge/static-site
  tag: ""
  # Optional pin; renders repository:tag@digest.
  digest: ""
  pullPolicy: IfNotPresent
# Secrets for pulling the SERVER image (not the site artifact).
imagePullSecrets: []

site:
  artifact:
    # registry/repository[:tag] of the site artifact, e.g.
    # registry.example.com/static/www. The default is a placeholder that
    # serves nothing: set it.
    ref: registry.example.com/static/site
    # sha256:<64 hex>. When set it wins over any tag in ref and pins the pull.
    # An independent value so that a promotion tool can write it alone.
    digest: ""
  # Name of a kubernetes.io/dockerconfigjson Secret holding the registry
  # credentials for the artifact. Empty for an anonymous registry.
  pullSecretName: ""
  # Talk plain HTTP to the registry (an in-cluster dev registry only).
  plainHTTP: false
  # Serve /index.html for extensionless paths that match no file.
  spaFallback: false
  # Page served with a 404 (path inside the site); empty for a plain 404.
  notFoundPage: 404.html
  # Refuse an artifact larger than this many bytes / with more files.
  maxBytes: 536870912
  maxFiles: 50000
  # Size of the memory-backed volume the artifact is unpacked into. Reloading
  # holds the old and the new copy at once, so allow for two.
  contentSizeLimit: 1Gi

# Serve-time placeholders: {{ name }} in html, js, css and json files is
# replaced by the value, for the names provided here and no others. Static
# sites are built once and the same bytes run in every environment; the
# per-environment values arrive here.
#
# Two sources, which may be combined:
#  - inline: every key except the three below is a name and its value. These
#    values are NOT secret (they land in public pages) and may use only
#    A-Za-z0-9 ._:/@#+=,~-
#  - a Secret: `secretName` is mounted read-only, one file per key. The chart
#    never creates it (an ExternalSecret does; see
#    docs/static-site.md). `secretKeys` lists the names the server expects
#    from it, `optionalKeys` the names that may be absent (served as empty).
#    With a Secret the server runs strict: a {{ token }} in the content that
#    is unknown, or declared but without a value, fails the load.
#    Nothing is rendered for the Secret while secretName is empty.
placeholders: {}
  # gtmId: GTM-XXXXXXX
  # secretName: static-site-values
  # secretKeys: [gtmId]
  # optionalKeys: []

cache:
  # File names matching this regexp are served immutable for a year. Empty
  # keeps the server's default (a dot, dash or underscore, 8+ hex digits,
  # then the extension: app.3f9a1c2b.js).
  hashedPattern: ""
  # Everything else, HTML included.
  htmlMaxAge: 60s
  staleWhileRevalidate: 300s

# Response headers added to every response, over the defaults (nosniff,
# X-Frame-Options DENY, a strict-origin-when-cross-origin referrer policy).
# An empty value removes a default.
headers: {}
  # Content-Security-Policy: "default-src 'self'"

logLevel: info

service:
  type: ClusterIP
  port: 80
  annotations: {}

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    memory: 256Mi

terminationGracePeriodSeconds: 40

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}
priorityClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}

# Ingress to the site port from `ingressFrom` (NetworkPolicyPeer list; empty
# means any source) and to the ops port from `metricsFrom`; egress to DNS and
# to HTTPS (the registry). `extraEgress` adds rules.
networkPolicy:
  enabled: false
  ingressFrom: []
  metricsFrom: []
  extraEgress: []
